[workspace]
resolver = "2"
members = ["crates/*"]

[profile.reldbg]
inherits = "release"
debug = true
lto = "fat"
incremental = true

[profile.release2]
inherits = "release"
opt-level = "z"
debug = false
strip = true
lto = true
codegen-units = 1
incremental = false
panic = "abort"

[patch.crates-io]
compio = { git = "https://github.com/three014/compio.git" }
compio-buf = { git = "https://github.com/three014/compio.git" }
compio-io = { git = "https://github.com/three014/compio.git" }
