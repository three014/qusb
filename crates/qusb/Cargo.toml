[package]
name = "qusb"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.6.0"
quinn = { version = "0.11.6", features = ["runtime-tokio"] }
rcgen = "0.13.1"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["io-util", "sync", "macros"] }
spec = { package = "qusb-spec", path = "../qusb-spec" }
postcard = { version = "1.0.10" }
nohash-hasher = "0.2.0"
rand = "0.8.5"
# evmap = "10.0.2"
serde = "1.0.215"
# bytes = "1.9.0"
tracing = "0.1.40"
tokio-util = "0.7.12"
nusb = "0.1.12"
futures-core = "0.3.31"
futures-util = "0.3.31"

[dev-dependencies]
tracing-test = "0.2.5"


