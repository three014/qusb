[package]
name = "qusb"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.6.0"
quinn = { version = "0.11.6", features = ["runtime-tokio"] }
rcgen = "0.13.1"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["io-util"] }
spec = { package = "qusb-spec", path = "../qusb-spec" }
# postcard = { version = "1.0.10", features = ["use-std"] }
postcard = { version = "1.0.10" }
nohash-hasher = "0.2.0"
rand = "0.8.5"
serde = "1.0.215"

