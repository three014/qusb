[package]
name = "qusb-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.28", features = ["wrap_help"] }
qusb = { path = "../qusb" }
rcgen = "0.13.2"
tokio = { version = "1.43.0", features = ["rt", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
