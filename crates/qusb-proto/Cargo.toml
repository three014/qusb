[package]
name = "qusb-proto"
version = "0.3.0"
edition = "2021"

[dependencies]
thiserror = "2.0.3"
zerocopy = "0.8.19"
zerocopy-derive = "0.8.19"
bytes = "1.9.0"
# tokio = { version = "1.42.0", default-features = false, features = ["io-util"] }
vhci = { package = "usb_vhci", git = "https://github.com/three014/usb_vhci", default-features = false, features = [
    "zerocopy",
] }
compio-io = "0.5.0"
compio-buf = { version = "0.5.1", default-features = false, features = ["bytes"] }
